      <path d="M32 24 Q42 20 44 6" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round"/>
      <ellipse cx="47" cy="5" rx="6" ry="4.5" fill="currentColor"/>
      <rect x="11" y="35" width="6" height="10" rx="3" fill="currentColor"/>
