      <ellipse cx="-5" cy="-4" rx="1.8" ry="3" transform="rotate(-25 -5 -4)" fill="currentColor"/>
      <ellipse cx="0" cy="-6" rx="1.8" ry="3" fill="currentColor"/>
      <ellipse cx="5" cy="-4" rx="1.8" ry="3" transform="rotate(25 5 -4)" fill="currentColor"/>
