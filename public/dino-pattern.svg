      <circle cx="49" cy="3.5" r="1.1" fill="#5b5670"/>
      <circle cx="18" cy="25" r="2.2" fill="#ffffff" opacity=".55"/>
      <circle cx="26" cy="28" r="1.6" fill="#ffffff" opacity=".55"/>
    </g>
    <g id="spiky">
      <path d="M10 20 L15 8 L20 19 L26 5 L32 18 L38 8 L41 20 Z" fill="currentColor" opacity=".7"/>
      <path d="M4 28 Q-4 30 -8 24" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
      <ellipse cx="24" cy="26" rx="20" ry="10" fill="currentColor"/>
