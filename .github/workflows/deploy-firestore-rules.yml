name: Deploy Firestore rules & indexes

on:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - firestore.indexes.json
      - firebase.json
      - .github/workflows/deploy-firestore-rules.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: |
          test -n "$ALLOWED_EMAIL"
          sed -i "s|REPLACE_WITH_ALLOWED_EMAIL|$ALLOWED_EMAIL|" firestore.rules
          ! grep -q REPLACE_WITH_ALLOWED_EMAIL firestore.rules
        env:
          ALLOWED_EMAIL: ${{ secrets.ALLOWED_EMAIL }}

      - run: npx --yes firebase-tools deploy --only firestore --project boseriko-apps --non-interactive --token "$FIREBASE_TOKEN"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
